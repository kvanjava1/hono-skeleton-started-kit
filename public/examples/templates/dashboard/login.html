<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk · NusaAdmin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E" />
  <!-- Terapkan tema sebelum render agar tidak berkedip.
       Default: gelap (dark-first); hanya "light" tersimpan yang memakai tema terang. -->
  <script>
    if (localStorage.theme !== 'light') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <!-- Tailwind Play CDN + plugin forms -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          boxShadow: {
            card: '0 1px 2px 0 rgb(0 0 0 / 0.05), 0 8px 24px -12px rgb(0 0 0 / 0.15)',
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    /* Komponen UI dasar — subset yang dipakai halaman login (identik dengan index.html).
       Untuk produksi, pindahkan ke file CSS proyek Tailwind-mu */
    .card { @apply border border-zinc-200 bg-white shadow-card dark:border-zinc-800 dark:bg-zinc-900; }
    .btn { @apply inline-flex items-center justify-center gap-2 px-4 py-2.5 text-base font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-950/50 dark:focus-visible:ring-zinc-100/50 disabled:pointer-events-none disabled:opacity-60; }
    .btn-primary { @apply bg-zinc-950 text-white shadow-sm hover:bg-zinc-800 active:bg-zinc-700 dark:bg-zinc-100 dark:text-zinc-950 dark:hover:bg-zinc-200 dark:active:bg-zinc-300; }
    .btn-secondary { @apply border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700; }
    .icon-btn { @apply grid h-10 w-10 place-items-center text-zinc-500 transition-colors hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white; }
    .input { @apply w-full border border-zinc-200 bg-white px-3.5 py-2.5 text-base text-zinc-900 placeholder:text-zinc-400 focus:border-zinc-950 dark:focus:border-zinc-100 focus:outline-none focus:ring-4 focus:ring-zinc-950/10 dark:focus:ring-zinc-100/10 dark:border-zinc-700 dark:bg-zinc-900 dark:text-white dark:placeholder:text-zinc-500; }
    .label { @apply mb-1.5 block text-base font-medium text-zinc-700 dark:text-zinc-300; }
  </style>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="grid min-h-full place-items-center bg-zinc-100 px-4 py-10 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">

  <!-- Partikel interaktif (dekoratif, tidak menangkap klik) -->
  <canvas id="particles" class="pointer-events-none fixed inset-0" aria-hidden="true"></canvas>

  <!-- Toggle tema (pojok kanan atas) -->
  <button data-theme-toggle class="icon-btn fixed right-4 top-4 z-10" aria-label="Ganti tema" title="Ganti tema">
    <svg class="h-6 w-6 dark:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
    <svg class="hidden h-6 w-6 dark:block" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
  </button>

  <main class="relative w-full max-w-md">
    <!-- Logo + sambutan -->
    <div class="mb-8 flex flex-col items-center text-center">
      <span class="grid h-14 w-14 place-items-center bg-zinc-950 text-white dark:bg-zinc-100 dark:text-zinc-950">
        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>
      </span>
      <h1 class="mt-4 text-3xl font-extrabold tracking-tight">Selamat datang kembali</h1>
      <p class="mt-1.5 text-base text-zinc-500 dark:text-zinc-400">Masuk untuk melanjutkan ke dasbor NusaAdmin.</p>
    </div>

    <div class="card p-6 sm:p-8">
      <form action="index.html" method="get" class="space-y-5">
        <div>
          <label for="email" class="label">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="andi@nusa.io" class="input" required />
        </div>

        <div>
          <label for="password" class="label">Kata Sandi</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" class="input !pr-12" required />
            <button type="button" data-password-toggle="#password" class="icon-btn absolute right-1 top-1/2 -translate-y-1/2" aria-label="Tampilkan kata sandi">
              <svg data-eye="show" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              <svg data-eye="hide" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3">
          <label class="flex items-center gap-2.5 text-base">
            <input type="checkbox" name="remember" class="h-5 w-5 rounded-none text-zinc-950 dark:text-zinc-100" checked />
            Ingat saya
          </label>
          <a href="#" class="text-sm font-semibold text-zinc-950 underline-offset-4 hover:underline dark:text-zinc-100">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full">Masuk</button>
      </form>

      <div class="my-6 flex items-center gap-4" aria-hidden="true">
        <span class="h-px flex-1 bg-zinc-200 dark:bg-zinc-800"></span>
        <span class="text-sm font-medium uppercase tracking-widest text-zinc-400 dark:text-zinc-500">atau</span>
        <span class="h-px flex-1 bg-zinc-200 dark:bg-zinc-800"></span>
      </div>

      <a href="#" class="btn btn-secondary w-full">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" /></svg>
        Masuk dengan SSO
      </a>
    </div>

    <p class="mt-6 text-center text-base text-zinc-500 dark:text-zinc-400">
      Belum punya akun?
      <a href="#" class="font-semibold text-zinc-950 underline-offset-4 hover:underline dark:text-zinc-100">Daftar sekarang</a>
    </p>

    <p class="mt-10 text-center text-sm text-zinc-400 dark:text-zinc-500">© 2026 NusaAdmin · Semua hak dilindungi</p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/particles.js"></script>
</body>
</html>
